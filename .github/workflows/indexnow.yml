name: IndexNow ping
on:
  push:
    branches: [main]
    paths: ['**/*.html', 'sitemap.xml']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The URL list is derived from sitemap.xml at run time instead of being
      # hard-coded. A hard-coded list silently goes stale every time a page is
      # added (that is how /steco-type-end-dump/ ended up never being pinged).
      - name: Submit sitemap URLs to IndexNow
        run: |
          set -euo pipefail
          jq -n \
            --arg host "gallegossales.com" \
            --arg key "0083787156c9b3f250dbe16bdb48d0f4" \
            --arg keyLocation "https://gallegossales.com/0083787156c9b3f250dbe16bdb48d0f4.txt" \
            --argjson urlList "$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed -e 's|<loc>||' -e 's|</loc>||' | jq -R . | jq -sc .)" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}' > body.json
          echo "Submitting $(jq '.urlList | length' body.json) URLs to IndexNow:"
          jq -r '.urlList[]' body.json
          curl -sS --fail -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data @body.json
